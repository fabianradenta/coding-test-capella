services:
  db:
    image: postgres:17
    container_name: financing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financing
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d financing']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
